<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Shape -->
  <rect x="10" y="10" width="180" height="180" rx="20" ry="20" fill="#FF6347" stroke="#EC0000" stroke-width="4"/>

  <!-- Browser Frame -->
  <rect x="30" y="40" width="140" height="100" rx="10" ry="10" fill="#FFFFFF" stroke="#EC0000" stroke-width="2"/>
  <rect x="30" y="40" width="140" height="20" fill="#EC0000"/>

  <!-- Tabs -->
  <rect x="35" y="45" width="20" height="10" rx="2" fill="#FFFFFF"/>
  <rect x="60" y="45" width="20" height="10" rx="2" fill="#FFFFFF"/>
  <rect x="85" y="45" width="20" height="10" rx="2" fill="#FFFFFF"/>

  <!-- Address Bar -->
  <rect x="35" y="70" width="130" height="15" rx="5" fill="#EC0000"/>

  <!-- Navigation Buttons -->
  <circle cx="45" cy="120" r="6" fill="#EC0000"/>
  <circle cx="65" cy="120" r="6" fill="#FF6347"/>
  <circle cx="85" cy="120" r="6" fill="#EC0000"/>
</svg>

